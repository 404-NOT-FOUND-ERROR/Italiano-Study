      /* Design tokens: Minimalist Modern. Fonts are embedded below at build time. */
      :root {
        color-scheme: light;
        --background: #fafafa;
        --foreground: #0f172a;
        --muted: #f1f5f9;
        --muted-foreground: #64748b;
        --subtle-text: #526179;
        --accent: #0052ff;
        --accent-secondary: #4d7cff;
        --accent-soft: #edf3ff;
        --accent-foreground: #fff;
        --border: #e2e8f0;
        --card: #fff;
        --success: #176649;
        --success-soft: #edf8f1;
        --danger: #b42337;
        --danger-soft: #fff1f2;
        --gradient: linear-gradient(125deg, var(--accent), var(--accent-secondary));
        /* Darker endpoint keeps small white action labels above 4.5:1 contrast. */
        --action-gradient: linear-gradient(125deg, var(--accent), #3566ef);
        --font-body: 'Inter', 'PingFang SC', 'Microsoft YaHei UI', system-ui, sans-serif;
        --font-display: 'Calistoga', 'PingFang SC', 'Microsoft YaHei UI', Georgia, serif;
        --font-mono: 'JetBrains Mono', 'Microsoft YaHei UI', monospace;
        --radius: 16px;
        --radius-sm: 12px;
        --shadow-sm: 0 1px 2px #0f172a04, 0 4px 10px #0f172a03;
        --shadow: 0 2px 6px #0f172a04, 0 12px 32px #0f172a06;
        --shadow-accent: 0 3px 8px #0052ff0a, 0 16px 36px #0052ff13;
        --header-height: 82px;
        --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
      }

      /* Foundations */
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--background);
        scroll-behavior: smooth;
        scroll-padding-top: 104px;
      }
      body {
        margin: 0;
        color: var(--foreground);
        background: var(--background);
        font: 400 14px/1.7 var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        min-width: 44px;
        min-height: 44px;
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a,
      input,
      textarea,
      select {
        touch-action: manipulation;
      }
      button {
        transition:
          color 0.2s,
          background 0.2s,
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s var(--ease);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      button.correct:disabled {
        opacity: 1;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }
      a {
        color: var(--accent);
        text-underline-offset: 4px;
      }
      ::selection {
        color: #fff;
        background: var(--accent);
      }
      h1,
      h2 {
        font-family: var(--font-display);
        font-weight: 400;
      }
      svg {
        flex-shrink: 0;
        vertical-align: middle;
      }
      input[type='checkbox'] {
        width: 20px;
        height: 20px;
        accent-color: var(--accent);
        flex: 0 0 auto;
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      .skip-link {
        position: fixed;
        top: 8px;
        left: 16px;
        z-index: 50;
        transform: translateY(-160%);
        padding: 10px 18px;
        border-radius: 10px;
        background: var(--foreground);
        color: #fff;
      }
      .skip-link:focus {
        transform: none;
      }
      .app {
        min-height: 100vh;
      }

      /* Shared actions */
      .primary-btn,
      .quiet-btn,
      .stage-action,
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 46px;
        padding: 10px 17px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--card);
        font-size: 13px;
        font-weight: 600;
      }
      .primary-btn {
        border-color: transparent;
        background: var(--action-gradient);
        color: #fff;
        box-shadow: 0 3px 10px #0052ff20;
      }
      .text-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 0;
        border: 0;
        background: transparent;
        color: var(--accent);
        font-size: 13px;
        font-weight: 500;
      }
      .icon-btn {
        width: 46px;
        padding: 0;
      }
      .primary-btn:active,
      .quiet-btn:active,
      .stage-action:active,
      .icon-btn:active {
        transform: scale(0.98);
      }
      .button-arrow {
        transition: transform 0.2s var(--ease);
      }

      /* App shell: persistent desktop rail, mobile bottom navigation. */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: var(--header-height);
        padding: 12px 32px;
        border-bottom: 1px solid var(--border);
        background: #fffffff5;
        backdrop-filter: blur(16px);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--foreground);
        text-decoration: none;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 14px 14px 14px 4px;
        background: var(--gradient);
        color: #fff;
        font: 400 28px/1 var(--font-display);
        box-shadow: 0 4px 12px #0052ff20;
      }
      .brand-name {
        display: block;
        font: 400 23px/1.15 var(--font-display);
        letter-spacing: -0.03em;
      }
      .brand-sub {
        display: block;
        margin-top: 5px;
        color: var(--muted-foreground);
        font-size: 10px;
        letter-spacing: 0.04em;
      }
      .top-nav {
        display: none;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .timer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 4px 4px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--card);
      }
      .timer-value {
        min-width: 49px;
        color: var(--foreground);
        font: 500 14px/1 var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .timer button {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 9px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 14px;
      }
      .layout {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        align-items: start;
        min-height: calc(100vh - var(--header-height));
      }
      .sidebar {
        position: sticky;
        top: var(--header-height);
        height: calc(100vh - var(--header-height));
        min-height: 570px;
        padding: 32px 18px;
        border-right: 1px solid var(--border);
        background: var(--card);
      }
      .side-label {
        margin: 0 12px 20px;
        color: var(--muted-foreground);
        font: 400 10px/1.5 var(--font-mono);
        letter-spacing: 0.12em;
      }
      .side-nav {
        display: grid;
        gap: 7px;
      }
      .nav-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 50px;
        padding: 12px 14px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted-foreground);
        font-size: 13px;
        font-weight: 500;
        text-align: left;
      }
      .nav-btn[aria-current='page'] {
        border-color: #0052ff0d;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .nav-glyph {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .sidebar-rule {
        height: 1px;
        margin: 28px 12px;
        background: var(--border);
      }
      .target-box {
        padding: 18px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--background);
      }
      .target-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .target-head strong {
        color: var(--subtle-text);
        font: 500 10px/1 var(--font-mono);
        letter-spacing: 0.08em;
      }
      .target-days {
        color: var(--accent);
        font: 400 25px/1 var(--font-display);
      }
      .target-days small {
        margin-left: 3px;
        font: 12px/1 var(--font-body);
      }
      .target-box p {
        margin: 12px 0 0;
        color: var(--muted-foreground);
        font-size: 11px;
        line-height: 1.9;
      }
      .target-box .text-btn {
        margin-top: 8px;
        font-size: 11px;
      }
      .rail-footer {
        margin: 28px 12px 0;
        color: var(--muted-foreground);
        font: 11px/1.8 var(--font-mono);
      }
      .rail-footer span {
        display: block;
        margin-top: 4px;
        font: 10px/1.7 var(--font-body);
      }
      main {
        min-width: 0;
        width: min(100%, 1280px);
        margin: 0 auto;
        padding: 42px clamp(24px, 3.4vw, 56px) 64px;
      }
      main:focus {
        outline: none;
      }
      main.is-entering {
        animation: page-in 0.42s var(--ease) both;
      }
      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 30px;
      }
      .page-head > div {
        min-width: 0;
      }
      .page-head h1 {
        max-width: 860px;
        margin: 17px 0 0;
        font-size: clamp(27px, 2.5vw, 38px);
        line-height: 1.4;
        letter-spacing: -0.025em;
      }
      .page-head p {
        max-width: 740px;
        margin: 12px 0 0;
        color: var(--muted-foreground);
        line-height: 1.9;
      }
      .page-head > button {
        flex-shrink: 0;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
        padding: 6px 11px;
        border: 1px solid #0052ff1a;
        border-radius: 999px;
        background: #0052ff08;
        color: var(--accent);
        font: 400 10px/1.6 var(--font-mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
        overflow-wrap: anywhere;
      }
      .eyebrow::before {
        content: '';
        flex: 0 0 auto;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
      }
      .section-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 5px 14px;
        margin-bottom: 16px;
      }
      .section-heading h2 {
        margin: 0;
        font-size: 20px;
        line-height: 1.5;
        letter-spacing: -0.02em;
      }
      .section-heading > span {
        color: var(--muted-foreground);
        font-size: 11px;
      }
      .section-label {
        color: var(--muted-foreground);
        font: 400 10px/1.5 var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .study-overview {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin: 4px 0 22px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }
      .study-overview h1 {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 10px;
        margin: 14px 0 0;
        font-size: 27px;
        line-height: 1.35;
      }
      .study-greeting {
        color: var(--accent);
        font: 400 38px/1 var(--font-display);
      }
      .study-subtitle {
        margin: 7px 0 0;
        color: var(--muted-foreground);
        font-size: 12px;
        line-height: 1.8;
      }
      .study-overview-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }
      /* Today: clear progress, focused tasks, and one strong next action. */
      .hero {
        position: relative;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 20px;
        align-items: center;
        min-height: 362px;
        margin: -5px 0 32px;
      }
      .hero-copy {
        position: relative;
        z-index: 1;
        padding: 7px 0;
      }
      .hero .eyebrow::before {
        animation: breathe 4s ease-in-out infinite;
      }
      .hero h1 {
        margin: 17px 0 14px;
        line-height: 1.12;
        letter-spacing: -0.03em;
      }
      .hero-greeting {
        display: block;
        margin-bottom: 11px;
        font: 400 clamp(58px, 5.8vw, 84px) / 1 var(--font-display);
        letter-spacing: -0.045em;
      }
      .hero-greeting > span {
        color: var(--accent);
      }
      .hero-message {
        display: block;
        font: 600 clamp(28px, 2.7vw, 39px) / 1.45 var(--font-body);
        letter-spacing: -0.05em;
      }
      .gradient-text {
        position: relative;
        white-space: nowrap;
        color: var(--accent);
        background: var(--gradient);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gradient-text::after {
        position: absolute;
        z-index: -1;
        right: 0;
        bottom: -2px;
        left: 0;
        height: 10px;
        border-radius: 3px;
        background: linear-gradient(90deg, #0052ff19, #4d7cff08);
        content: '';
      }
      .hero-description {
        max-width: 420px;
        margin: 0;
        color: var(--muted-foreground);
        font-size: 14px;
        line-height: 1.9;
      }
      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 11px;
        margin-top: 24px;
      }
      .hero-actions button {
        min-height: 49px;
        padding-inline: 20px;
      }
      .hero-footnote {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 16px;
        color: var(--muted-foreground);
        font-size: 11px;
      }
      .hero-footnote svg {
        color: var(--accent);
      }
      .hero-footnote .separator {
        margin-inline: 3px;
        color: #c3cbd6;
      }
      .hero-art {
        position: relative;
        align-self: stretch;
        min-width: 0;
        min-height: 365px;
        isolation: isolate;
      }
      .art-atmosphere {
        position: absolute;
        inset: -10px -10px 0;
        border-radius: 50%;
        background: radial-gradient(ellipse, #0052ff0e 0%, #4d7cff05 45%, transparent 70%);
      }
      .dot-grid {
        position: absolute;
        top: 6%;
        right: 1%;
        width: 112px;
        height: 112px;
        opacity: 0.2;
        background: radial-gradient(circle, var(--accent) 1px, transparent 1px) 0 0 / 14px 14px;
        mask-image: linear-gradient(135deg, transparent, #000);
      }
      .orbital-ring {
        position: absolute;
        top: calc(50% - 147px);
        left: calc(50% - 147px);
        width: 294px;
        height: 294px;
        border: 1px dashed #0052ff38;
        border-radius: 50%;
        animation: orbit 65s linear infinite;
      }
      .orbital-ring::before {
        position: absolute;
        top: 32px;
        left: 37px;
        width: 10px;
        height: 10px;
        border: 3px solid var(--background);
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 1px #0052ff20;
        content: '';
      }
      .a2-orb {
        position: absolute;
        top: calc(50% - 112px);
        left: calc(50% - 112px);
        display: grid;
        place-content: center;
        width: 224px;
        height: 224px;
        border: 1px solid #ffffff45;
        border-radius: 50%;
        background: radial-gradient(
          circle at 32% 24%,
          #81a4ff 0,
          #4d7cff 23%,
          #0052ff 60%,
          #0038c2 100%
        );
        color: #fff;
        text-align: center;
        box-shadow:
          inset -8px -14px 28px #00248130,
          inset 4px 5px 15px #ffffff20,
          0 26px 40px #0052ff1a;
      }
      .a2-orb strong {
        font: 400 70px/1.1 var(--font-display);
        letter-spacing: -0.04em;
      }
      .a2-orb small {
        margin-top: 3px;
        color: #fff;
        font: 400 9px/1.5 var(--font-mono);
        letter-spacing: 0.19em;
      }
      .floating-card {
        position: absolute;
        z-index: 2;
        border: 1px solid #ffffffd9;
        border-radius: var(--radius);
        background: #fffffff5;
        box-shadow:
          0 3px 8px #0f172a05,
          0 18px 36px #0f172a0c;
        animation: float 5s ease-in-out infinite;
      }
      .hello-card {
        top: 35px;
        left: -4px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 17px 21px;
        transform: rotate(-7deg);
      }
      .hello-card strong {
        display: block;
        font: 400 29px/1.15 var(--font-display);
      }
      .hello-card small {
        display: block;
        margin-top: 4px;
        color: var(--muted-foreground);
        font-size: 11px;
      }
      .waveform {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 30px;
      }
      .waveform i {
        width: 3px;
        height: 10px;
        border-radius: 10px;
        background: var(--gradient);
      }
      .waveform i:nth-child(2),
      .waveform i:nth-child(4) {
        height: 22px;
      }
      .waveform i:nth-child(3) {
        height: 30px;
      }
      .daily-card {
        right: -4px;
        bottom: 33px;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 17px;
        animation-duration: 4.5s;
        animation-delay: -1.5s;
        transform: rotate(6deg);
      }
      .daily-icon {
        display: grid;
        place-items: center;
        width: 43px;
        height: 43px;
        border-radius: 13px;
        background: var(--gradient);
        color: #fff;
      }
      .daily-card strong {
        display: block;
        font: 600 20px/1.2 var(--font-body);
        letter-spacing: -0.04em;
      }
      .daily-card strong span {
        font-size: 12px;
        font-weight: 400;
      }
      .daily-card small {
        display: block;
        margin-top: 5px;
        color: var(--muted-foreground);
        font: 400 8px/1.5 var(--font-mono);
        letter-spacing: 0.06em;
      }
      .orbit-spark {
        position: absolute;
        right: 22px;
        top: 45px;
        width: 23px;
        height: 23px;
        color: var(--accent);
      }
      .art-caption {
        position: absolute;
        bottom: 0;
        left: 24px;
        color: var(--muted-foreground);
        font: 400 9px/1.5 var(--font-mono);
        letter-spacing: 0.09em;
      }

      /* Inverted section, with a restrained dotted texture and blue ambient light. */
      .metrics {
        position: relative;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        overflow: hidden;
        margin-bottom: 36px;
        border: 1px solid #1c2a48;
        border-radius: var(--radius);
        background: var(--foreground);
        color: #fff;
        isolation: isolate;
      }
      .metrics::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.07;
        background: radial-gradient(circle, white 0.7px, transparent 1px) 0 0 / 16px 16px;
        content: '';
      }
      .metrics::after {
        position: absolute;
        inset: -100px -30px -120px 45%;
        z-index: -1;
        background: radial-gradient(ellipse, #0052ff3d, transparent 65%);
        content: '';
      }
      .metric {
        position: relative;
        min-width: 0;
        padding: 23px 26px;
      }
      .metric + .metric::before {
        position: absolute;
        top: 26px;
        bottom: 26px;
        left: 0;
        width: 1px;
        background: #ffffff1a;
        content: '';
      }
      .metric-label {
        color: var(--muted-foreground);
        font-size: 11px;
      }
      .metrics .metric-label {
        color: #bec9df;
      }
      .metric-value {
        margin-top: 6px;
        font: 400 31px/1.2 var(--font-display);
        letter-spacing: -0.025em;
      }
      .metric-context {
        margin-left: 5px;
        color: #bec9df;
        font: 400 11px/1.5 var(--font-body);
        letter-spacing: 0;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.9fr);
        align-items: start;
        gap: 26px;
      }
      .stage-list {
        display: grid;
        gap: 11px;
      }
      .stage-row {
        display: grid;
        grid-template-columns: 33px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 98px;
        padding: 15px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--card);
        box-shadow: var(--shadow-sm);
      }
      .stage-row.is-next {
        border-color: #0052ff66;
        box-shadow:
          0 0 0 3px #0052ff05,
          var(--shadow);
      }
      .stage-number {
        display: grid;
        place-items: center;
        width: 33px;
        height: 33px;
        border-radius: 10px;
        background: var(--muted);
        color: var(--subtle-text);
        font: 500 11px/1 var(--font-mono);
      }
      .is-done .stage-number {
        background: var(--success-soft);
        color: var(--success);
      }
      .is-next .stage-number {
        background: var(--gradient);
        color: #fff;
      }
      .stage-title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.6;
      }
      .stage-detail {
        margin-top: 5px;
        color: var(--muted-foreground);
        font-size: 11px;
        line-height: 1.7;
      }
      .stage-side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .stage-time {
        color: var(--muted-foreground);
        font: 400 10px/1.5 var(--font-mono);
      }
      .stage-action {
        min-width: 100px;
        min-height: 44px;
        padding: 7px 12px;
        background: var(--muted);
        border-color: transparent;
        font-size: 11px;
      }
      .stage-row.is-next .stage-action {
        background: var(--action-gradient);
        color: #fff;
      }
      .side-stack {
        display: grid;
        min-width: 0;
        gap: 20px;
      }
      .quote-box {
        position: relative;
        padding: 24px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        background:
          linear-gradient(#fff, #fff) padding-box,
          var(--gradient) border-box;
        box-shadow: var(--shadow-accent);
      }
      .quote-box .section-label {
        display: block;
        margin-bottom: 15px;
        color: var(--accent);
      }
      .quote-decoration {
        position: absolute;
        top: 6px;
        right: 18px;
        color: #0052ff0c;
        font: 400 100px/1 var(--font-display);
        pointer-events: none;
      }
      .quote-italian {
        position: relative;
        margin: 20px 0 8px;
        font: 400 28px/1.4 var(--font-display);
        overflow-wrap: anywhere;
        letter-spacing: -0.02em;
      }
      .quote-translation {
        color: var(--muted-foreground);
        font-size: 13px;
      }
      .quote-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 2px 10px;
        margin-top: 20px;
      }
      .quote-hint {
        color: var(--muted-foreground);
        font-size: 10px;
      }
      .progress-block {
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow-sm);
      }
      .progress-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .progress-top strong {
        font-size: 13px;
        font-weight: 600;
      }
      .progress-top span {
        color: var(--accent);
        font: 400 12px/1.5 var(--font-mono);
        white-space: nowrap;
      }
      .progress-track {
        overflow: hidden;
        height: 5px;
        margin-top: 17px;
        border-radius: 99px;
        background: var(--muted);
      }
      .progress-fill {
        height: 100%;
        border-radius: inherit;
        background: var(--gradient);
        transition: width 0.25s var(--ease);
      }
      .progress-note {
        margin: 13px 0 0;
        color: var(--muted-foreground);
        font-size: 11px;
        line-height: 1.9;
      }
      .route-preview {
        margin-top: 38px;
      }
      .route-tiles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 15px;
      }
      .route-tile {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 23px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow-sm);
      }
      .route-tile .content-index {
        display: grid;
        place-items: center;
        width: 35px;
        height: 35px;
        margin-bottom: 17px;
        border-radius: 11px;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .route-tile h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .route-tile p {
        flex: 1;
        margin: 7px 0 15px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .route-tile .text-btn {
        font-size: 11px;
      }
      .page-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 5px 16px;
        margin-top: 36px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        color: var(--muted-foreground);
        font-size: 10px;
      }
      .page-footer strong {
        color: var(--subtle-text);
        font: 400 15px/1 var(--font-display);
      }

      /* Reusable learning surfaces. */
      .panel {
        min-width: 0;
        padding: 25px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow-sm);
      }
      .panel + .panel {
        margin-top: 20px;
      }
      .panel h2,
      .panel h3 {
        margin: 0;
        font-size: 18px;
        line-height: 1.6;
      }
      .panel h3 {
        font-family: var(--font-body);
        font-size: 15px;
        font-weight: 600;
      }
      .panel p {
        margin: 10px 0 0;
        color: var(--muted-foreground);
        line-height: 1.9;
      }
      .panel .section-heading {
        margin-bottom: 12px;
      }
      .content-list {
        display: grid;
        gap: 0;
        margin-top: 24px;
      }
      .content-row {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 70px;
        padding: 15px 0;
        border-bottom: 1px solid var(--border);
      }
      .content-row:last-child {
        border-bottom: 0;
      }
      .content-index {
        color: var(--accent);
        font: 400 12px/1.4 var(--font-mono);
      }
      .content-text {
        flex: 1;
        min-width: 0;
      }
      .content-text strong {
        display: block;
        font-size: 13px;
        font-weight: 600;
      }
      .content-text small {
        display: block;
        margin-top: 3px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .content-row button {
        flex-shrink: 0;
        padding: 8px 0 8px 8px;
        border: 0;
        background: transparent;
        color: var(--accent);
        font-size: 11px;
      }
      .unit-list {
        display: grid;
        gap: 13px;
        margin-top: 25px;
      }
      .unit-card {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow-sm);
      }
      .unit-btn {
        display: grid;
        grid-template-columns: 43px minmax(0, 1fr) auto;
        align-items: center;
        gap: 17px;
        width: 100%;
        padding: 21px;
        border: 0;
        background: transparent;
        text-align: left;
      }
      .unit-btn[aria-expanded='true'] {
        background: #0052ff04;
      }
      .unit-num {
        display: grid;
        place-items: center;
        width: 41px;
        height: 41px;
        border-radius: 12px;
        background: var(--accent-soft);
        color: var(--accent);
        font: 400 14px/1 var(--font-mono);
      }
      .unit-title {
        display: block;
        font-weight: 600;
      }
      .unit-goal {
        display: block;
        margin-top: 5px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .unit-count {
        color: var(--muted-foreground);
        font: 400 11px/1.6 var(--font-mono);
        white-space: nowrap;
      }
      .unit-lessons {
        display: grid;
        padding: 0 21px 14px 81px;
      }
      .lesson-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        width: 100%;
        min-height: 54px;
        padding: 10px 0;
        border: 0;
        border-bottom: 1px solid var(--border);
        background: transparent;
        text-align: left;
        font-size: 13px;
      }
      .lesson-btn:last-child {
        border-bottom: 0;
      }
      .lesson-status {
        color: var(--muted-foreground);
        font-size: 11px;
        white-space: nowrap;
      }
      .lesson-status.done {
        color: var(--success);
      }
      .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin: 23px 0;
      }
      .search-field,
      .select-field,
      .note-field {
        min-width: 0;
        min-height: 48px;
        max-width: 100%;
        padding: 12px 15px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--card);
        color: var(--foreground);
      }
      .search-field {
        width: min(100%, 360px);
      }
      .select-field {
        min-width: 185px;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--muted-foreground);
        opacity: 1;
      }
      .word-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .word-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: space-between;
        min-width: 0;
        min-height: 160px;
        padding: 21px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.2s var(--ease),
          box-shadow 0.2s;
      }
      .word-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
      }
      .word-card-top > div {
        min-width: 0;
      }
      .word-italian {
        font: 500 20px/1.4 var(--font-body);
        letter-spacing: -0.03em;
        overflow-wrap: anywhere;
      }
      .word-chinese {
        margin-top: 7px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .word-meta {
        margin-top: 10px;
      }
      .word-meta button {
        padding: 8px 0;
        border: 0;
        background: transparent;
        color: var(--accent);
        font-size: 12px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--success-soft);
        color: var(--success);
        font: 400 10px/1.6 var(--font-mono);
      }
      .tag.coral {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .empty-state {
        padding: 40px 22px;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        color: var(--muted-foreground);
        text-align: center;
      }
      .practice-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .scenario-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-width: 0;
        min-height: 235px;
        padding: 25px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow);
        transition:
          transform 0.2s var(--ease),
          box-shadow 0.2s;
      }
      .scenario-card .tag {
        margin-bottom: 22px;
      }
      .scenario-card strong {
        font-size: 17px;
        font-weight: 600;
      }
      .scenario-card p {
        flex: 1;
        margin: 9px 0 22px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .lesson-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(285px, 0.8fr);
        align-items: start;
        gap: 22px;
      }
      .phrase-card {
        padding: 22px;
        border: 1px solid #e9eef8;
        border-radius: var(--radius-sm);
        background: var(--muted);
      }
      .phrase-card .phrase {
        margin: 0;
        color: var(--foreground);
        font: 500 30px/1.5 var(--font-body);
      }
      .phrase-card .translation {
        margin-top: 12px;
        color: var(--subtle-text);
      }
      .word-pool,
      .word-answer {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 57px;
        margin-top: 15px;
      }
      .word-answer {
        padding: 8px 0 15px;
        border-bottom: 1px dashed #c4cedf;
      }
      .word-answer:empty::before {
        color: var(--subtle-text);
        font-size: 12px;
        content: '点下方的词，排出意大利语句子';
      }
      .word-btn {
        min-height: 44px;
        padding: 8px 13px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        font-size: 14px;
        box-shadow: 0 2px 0 #dce4ee;
      }
      .word-answer .word-btn {
        border-color: #0052ff26;
        background: #e4ecff;
        color: var(--accent);
        box-shadow: 0 2px 0 #0052ff20;
      }
      .dialogue {
        display: grid;
        gap: 8px;
        margin-top: 15px;
      }
      .dialogue-line {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) 44px;
        align-items: start;
        gap: 10px;
        padding: 15px 0;
        border-bottom: 1px solid var(--border);
      }
      .dialogue-speaker {
        padding-top: 3px;
        color: var(--muted-foreground);
        font: 400 10px/1.7 var(--font-mono);
        overflow-wrap: anywhere;
      }
      .dialogue-it {
        font: 500 15px/1.65 var(--font-body);
        overflow-wrap: anywhere;
      }
      .dialogue-zh {
        margin-top: 5px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .mini-board {
        padding: 17px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
      }
      .mini-board h3 {
        margin: 0 0 13px;
        font-size: 13px;
      }
      .sound-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
        gap: 9px;
      }
      .sound-cell {
        display: grid;
        align-content: start;
        gap: 4px;
        min-width: 0;
        min-height: 105px;
        padding: 13px;
        border: 1px solid transparent;
        border-radius: 11px;
        background: var(--muted);
        text-align: left;
      }
      .sound-cell strong {
        color: var(--accent);
        font: 500 23px/1.2 var(--font-body);
      }
      .sound-cell small {
        color: var(--subtle-text);
        font-size: 11px;
      }
      .sound-cell > span {
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .speak-btn {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        min-height: 44px;
        padding: 0;
        border: 1px solid #0052ff0d;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .grammar-note {
        padding: 19px 21px;
        border: 1px solid #0052ff17;
        border-left: 3px solid var(--accent);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        background: var(--accent-soft);
      }
      .grammar-note strong {
        display: block;
        color: #27426c;
        font-size: 13px;
        font-weight: 600;
      }
      .grammar-note p {
        margin: 7px 0 0;
        color: #465e80;
        font-size: 12px;
        line-height: 1.9;
      }
      .check-question {
        padding: 19px 0;
        border-bottom: 1px solid var(--border);
      }
      .check-question:last-child {
        border-bottom: 0;
      }
      .check-question strong {
        display: block;
        margin-bottom: 14px;
        font-size: 15px;
        font-weight: 600;
      }
      .choice-list {
        display: grid;
        gap: 10px;
      }
      .choice-btn {
        width: 100%;
        min-height: 48px;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--card);
        text-align: left;
        font-size: 13px;
      }
      .choice-btn.correct {
        border-color: #17664944;
        background: var(--success-soft);
        color: var(--success);
      }
      .choice-btn.wrong {
        border-color: #b4233744;
        background: var(--danger-soft);
        color: var(--danger);
      }
      .feedback {
        min-height: 23px;
        margin-top: 13px;
        color: var(--subtle-text);
        font-size: 12px;
        line-height: 1.9;
      }
      .feedback.good {
        color: var(--success);
      }
      .feedback.bad {
        color: var(--danger);
      }
      .scenario-chat {
        display: grid;
        gap: 15px;
        margin: 24px 0;
      }
      .chat-line {
        justify-self: start;
        max-width: 87%;
        padding: 16px 18px;
        border-radius: 16px 16px 16px 4px;
        background: var(--muted);
      }
      .chat-line.you {
        justify-self: end;
        border-radius: 16px 16px 4px 16px;
        background: var(--accent-soft);
      }
      .chat-label {
        margin-bottom: 7px;
        color: var(--subtle-text);
        font-size: 10px;
      }
      .chat-it {
        font: 500 15px/1.7 var(--font-body);
      }
      .chat-zh {
        margin-top: 7px;
        color: var(--subtle-text);
        font-size: 12px;
      }
      .scenario-options {
        display: grid;
        gap: 11px;
      }
      .scenario-choice {
        width: 100%;
        min-height: 55px;
        padding: 14px 17px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--card);
        text-align: left;
      }
      .scenario-choice span {
        display: block;
        font: 500 14px/1.6 var(--font-body);
      }
      .scenario-choice small {
        display: block;
        margin-top: 4px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .quiz-progress {
        margin: 5px 0 12px;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .note-field {
        width: 100%;
        min-height: 180px;
        margin-top: 17px;
        resize: vertical;
        line-height: 1.9;
      }
      .inline-note {
        margin-top: 13px;
        color: var(--muted-foreground);
        font-size: 11px;
        line-height: 1.9;
      }
      .phrase-card .inline-note {
        color: var(--subtle-text);
      }
      .backup-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }
      .table-list {
        display: grid;
        margin-top: 12px;
      }
      .skill-row {
        display: grid;
        grid-template-columns: 65px minmax(0, 1fr) 125px;
        gap: 22px;
        align-items: start;
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
      }
      .skill-row:first-child {
        padding-top: 4px;
      }
      .skill-row:last-child {
        border-bottom: 0;
      }
      .skill-name {
        padding-top: 2px;
        color: var(--accent);
        font-size: 16px;
        font-weight: 600;
      }
      .skill-desc,
      .skill-evidence {
        color: var(--muted-foreground);
        font-size: 12px;
        line-height: 1.9;
      }
      .skill-evidence {
        margin-top: 7px;
      }
      .skill-row > .skill-evidence {
        margin-top: 3px;
        text-align: right;
        font-size: 11px;
      }
      .skill-row .quiet-btn,
      .skill-row .primary-btn {
        font-size: 11px;
      }
      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 40;
        max-width: min(420px, calc(100vw - 32px));
        padding: 16px 20px;
        border: 1px solid #ffffff26;
        border-radius: var(--radius-sm);
        background: var(--foreground);
        color: #fff;
        box-shadow: 0 8px 30px #0f172a24;
        font-size: 13px;
      }

      /* Hover effects only on devices with an actual hover pointer. */
      @media (hover: hover) {
        .primary-btn:hover:not(:disabled),
        .is-next .stage-action:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 20px #0052ff38;
        }
        .quiet-btn:hover:not(:disabled),
        .icon-btn:hover {
          transform: translateY(-2px);
          border-color: #0052ff4d;
          background: #f8faff;
          box-shadow: var(--shadow-accent);
        }
        .primary-btn:hover .button-arrow,
        .quiet-btn:hover .button-arrow,
        .text-btn:hover .button-arrow {
          transform: translateX(3px);
        }
        .nav-btn:hover,
        .unit-btn:hover,
        .lesson-btn:hover {
          color: var(--accent);
          background: #0052ff05;
        }
        .text-btn:hover {
          color: #003fc7;
        }
        .stage-action:hover,
        .word-btn:hover,
        .speak-btn:hover,
        .timer button:hover,
        .sound-cell:hover,
        .scenario-choice:hover,
        .choice-btn:hover:not(:disabled) {
          border-color: #0052ff4d;
          background: var(--accent-soft);
        }
        .word-card:hover,
        .scenario-card:hover {
          transform: translateY(-3px);
          box-shadow: var(--shadow-accent);
        }
      }
      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes float {
        0%,
        100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -10px;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          box-shadow: 0 0 0 0 #0052ff15;
        }
        50% {
          box-shadow: 0 0 0 4px #0052ff00;
        }
      }
      @keyframes page-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Medium desktop / tablet */
      @media (max-width: 1230px) {
        .layout {
          grid-template-columns: 204px minmax(0, 1fr);
        }
        .sidebar {
          padding-inline: 13px;
        }
        main {
          padding-inline: 28px;
        }
        .hero {
          grid-template-columns: 1.1fr 0.9fr;
        }
        .hero-greeting {
          font-size: 70px;
        }
        .hero-message {
          font-size: 29px;
        }
        .hero-art {
          scale: 0.88;
          margin-inline: -12px;
        }
        .hero-actions button {
          padding-inline: 16px;
        }
        .dashboard-grid {
          grid-template-columns: minmax(0, 1.3fr) minmax(260px, 0.9fr);
          gap: 20px;

        .stage-row {
          grid-template-columns: 30px minmax(0, 1fr);
          gap: 8px 11px;
        }
        .stage-side {

          align-items: center;
          justify-content: space-between;
        }
        .metric {

        }
        .word-grid,

          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .lesson-layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .lesson-layout > .side-stack {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          align-items: start;
        }
        .quote-box {
          padding: 21px;
        }
        .quote-italian {

        }
      }
      @media (max-width: 1060px) and (min-width: 981px) {

        .hero {

          if(!test||!Number.isInteger(choice)||choice<0||choice>=test[1].length) return true;
          const answers=state.lab.grammar[id]||(state.lab.grammar[id]=[]);

          if (!token) return;
          if (action === 'add-token') s.selected.push(token);
          else s.selected = s.selected.filter((t) => t.index !== token.index);
          render();
          (
            main.querySelector('.word-pool .word-btn') ||
            main.querySelector('[data-action="check-order"]')
          )?.focus();
          return;
        }
        if (action === 'clear-order') {
          builders.get(button.dataset.lesson).selected = [];
          render();
          return;
        }
        if (action === 'check-order') {
          const l = lessonMap.get(button.dataset.lesson),
            s = builders.get(l.id),
            ordered = s.selected.map((t) => t.text).join(' ');
          const feedback = main.querySelector('.phrase-card .feedback');
          if (ordered === l.build) {
            resolveMistake('order', l.id, -1, 'order');
            markTeacherStep(l.id, 'understand');
            markTeacherStep(l.id, 'output');
            markTeacherStep(l.id, 'check');
            workFor(l.id).order = true;
            state.completed[l.id] = dateKey();
            const day = getDay();
            if (day.lessonId === l.id) day.lesson = true;
            markComplete(day);
            render();
            toast('顺序正确！这节微课已记录。现在试着不看文字说一遍。');
            main.querySelector('[data-action="check-order"]')?.focus();
          } else {
            if (ordered) {
              rememberMistake({
                kind: 'order',
                source: 'order',
                lessonId: l.id,
                topic: '词序 · ' + l.title,
                original: ordered,
                corrected: l.build,
                reason: '意大利语通常需要按主语、动词和补充信息的顺序组成句子。',
                avoid: '先找动词，再确认谁做什么，最后放时间和地点。',
                wordIds: l.wordIds,
              });
            }
            feedback.classList.remove('good');
            feedback.classList.add('bad');
            feedback.textContent = ordered
              ? '顺序还不自然。点已选词可撤回，再试一次。'
              : '先点词，把句子排出来。';
          }
          return;
        }
        if (action === 'add-word') {
          addWord(button.dataset.word);
          return;
        }
        if (action === 'add-lesson-words') {
          const l = lessonMap.get(button.dataset.lesson);
          l.wordIds.forEach((id) => {
            state.words[id] = state.words[id] || { due: Date.now(), interval: 0, reviews: 0 };
          });
          save();
          toast(`已加入 ${l.wordIds.length} 个本课词句。`);
          return;
        }
        if (action === 'flip-card') {
          reviewSession.revealed = true;
          render();
          return;
        }
        if (action === 'rate-card') {
          rateWord(button.dataset.rating);
          return;
        }
        if (action === 'start-scenario') {
          beginScenario(Number(button.dataset.scenario));
          return;
        }
        if (action === 'scenario-translation') {
          scenarioSession.translation = !scenarioSession.translation;
          render();
          return;
        }
        if (action === 'scenario-answer') {
          const s = scenarioSession,
            scenario = scenarios[s.id],
            turn = scenario.turns[s.turn],
            choice = turn.choices[Number(button.dataset.choice)];
          if (!choice || !choice[2]) {
            s.wrong++;
            rememberMistake({
              kind: `scenario-${s.turn}`,
              source: 'scenario',
              scenarioIndex: s.id,
              questionIndex: s.turn,
              topic: '情境 · ' + scenario.title,
              original: choice?.[0] || '',
              corrected: turn.choices.find((item) => item[2])?.[0] || '',
              reason: '回看对方的话，确认问题是在问地点、时间、请求还是回应。',
              avoid: '先听懂对方意图，再选语义和场景都合适的回应。',
              wordIds: relatedWordIds(`${turn.bot[1]} ${choice?.[0] || ''}`),
            });
            scenarioFeedback = '这句不太适合当前对话。想想对方在问什么，再选一次。';
            render();
            return;
          }
          resolveMistake('scenario', '', s.turn, `scenario-${s.turn}`, s.id);
          const bot = turn.bot;
          s.history.push(
            { who: speakerLabel(bot[0]), it: bot[1], zh: bot[2] },
            { who: '你', it: choice[0], zh: choice[1], you: true },
          );
          s.turn++;
          scenarioFeedback = '';
          if (s.turn === scenario.turns.length) {
            finishScenario(s.id);
          }
          render();
          return;
        }
        if (action === 'quiz-answer') {
          answerQuiz(Number(button.dataset.question), Number(button.dataset.choice));
          return;
        }
        if (action === 'exam-answer') {
          answerExam(button.dataset.mode, Number(button.dataset.question), Number(button.dataset.choice));
          return;
        }
        if (action === 'exam-match-answer') {
          const selected = document.getElementById('examMatchAnswer')?.value;
          if (selected === '' || selected == null) {
            toast('先选择与情境匹配的信息。');
            document.getElementById('examMatchAnswer')?.focus();
            return;
          }
          answerExam(button.dataset.mode, Number(button.dataset.question), Number(selected));
          return;
        }
        if (action === 'exam-text-answer') {
          const mode = button.dataset.mode;
          const index = Number(button.dataset.question);
          const item = examItems[mode]?.[index];
          const written = normalizeItalian(document.getElementById('examTextAnswer')?.value || '');
          if (!item || !written) {
            toast('先填写缺少的词或短语。');
            return;
          }
          const normalized = written.toLocaleLowerCase('it').replace(/[.!?]+$/, '').trim();
          const correct = (item.accepted || [item.choices[item.correct]]).some((text) => text.toLocaleLowerCase('it') === normalized);
          answerExam(mode, index, correct ? item.correct : (item.correct + 1) % item.choices.length, written);
          return;
        }
        if (action === 'exam-next') {
          nextExam(button.dataset.mode);
          return;
        }
        if (action === 'exam-restart') {
          const mode = button.dataset.mode;
          if (!Object.hasOwn(examItems, mode)) return;
          state.examProgress[mode] = { index: 0, answers: [], done: false };
          save();
          render();
          return;
        }
        if (action === 'quiz-next') {
          nextQuiz();
          return;
        }
        if (action === 'quiz-again') {
          const d = getDay();
          d.quiz = false;
          d.quizIndex = 0;
          d.quizAnswers = [];
          workFor(d.lessonId).first = {};
          workFor(d.lessonId).last = {};
          save();
          render();
          return;
        }
        if (action === 'self-check') {
          const i = Number(button.dataset.skill),
            val = Number(button.dataset.value);
          const mapping = { 0: [false, false], 1: [true, false], 2: [true, true] };
          state.checks[i] = mapping[val];
          save();
          render();
          return;
        }
        if (action === 'draft-check') {
          state.draftChecks[button.dataset.key] = button.checked;
          save();
          return;
        }
        if (action === 'speaking-check') {
          state.speaking[0] = button.dataset.value;
          save();
          render();
          return;
        }
        if (action === 'save-target') {
          const date = document.getElementById('targetDate').value;
          if (!validDate(date)) {
            toast('请选择有效的学习目标日期。');
            return;
          }
          if (date < dateKey()) {
            toast('学习目标日期需要是今天或之后。');
            return;
          }
          state.targetDate = date;
          save();
          toast(`目标日期更新为 ${date}。`);
          render();
          return;
        }
        if (action === 'export') {
          exportData();
          return;
        }
        if (action === 'import') {
          document.getElementById('importFile').click();
          return;
        }
      });
      document.addEventListener('input', (event) => handleLabInput(event.target));
      document.addEventListener('change', (event) => {
        handleLabChange(event.target);
        if (event.target.id === 'importFile') {
          importData(event.target.files?.[0]);
          event.target.value = '';
        }
      });
      document.querySelector('.skip-link').addEventListener('click', (event) => {
        event.preventDefault();
        main.focus({ preventScroll: true });
        main.scrollIntoView({ behavior: 'instant', block: 'start' });
      });
      document.getElementById('timerToggle').addEventListener('click', toggleTimer);
      document.getElementById('backupOpen').addEventListener('click', () => go('records'));
      window.addEventListener('hashchange', () => {
        window.speechSynthesis?.cancel();
        render();
        focusPage();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && timerEnd) {
          timerRemaining = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
          timerEnd = 0;
          setTimerButton();
          drawTimer();
        }
      });
      setInterval(drawTimer, 1000);
      render();
    </script>
